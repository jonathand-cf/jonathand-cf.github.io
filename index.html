---
layout: home
author_profile: true
---

<section class="gh-dashboard" aria-label="GitHub and CTF Activity">
  <div class="gh-dashboard__stats">
    <a href="{{ '/write-ups/' | relative_url }}" class="gh-stat">
      <span class="gh-stat__value">27</span>
      <span class="gh-stat__label"><i class="fas fa-flag" aria-hidden="true"></i> CTF Write-Ups</span>
    </a>
    <a href="{{ '/categories/' | relative_url }}" class="gh-stat">
      <span class="gh-stat__value">{{ site.posts.size }}</span>
      <span class="gh-stat__label"><i class="fas fa-terminal" aria-hidden="true"></i> Articles &amp; Guides</span>
    </a>
    <a href="https://github.com/jonathand-cf?tab=repositories" target="_blank" rel="noopener noreferrer" class="gh-stat">
      <span class="gh-stat__value" id="gh-repo-count">15+</span>
      <span class="gh-stat__label"><i class="fab fa-github" aria-hidden="true"></i> Public Repos</span>
    </a>
    <a href="https://github.com/jonathand-cf" target="_blank" rel="noopener noreferrer" class="gh-stat" id="gh-latest-link">
      <span class="gh-stat__value gh-stat__value--mono" id="gh-latest-repo">AirPoint</span>
      <span class="gh-stat__label"><i class="fas fa-code-branch" aria-hidden="true"></i> <span id="gh-latest-time">Latest Push</span></span>
    </a>
  </div>

  <div class="gh-dashboard__graph">
    <div class="gh-dashboard__header">
      <span class="gh-dashboard__title"><i class="fab fa-github" aria-hidden="true"></i> Contribution Activity</span>
      <a href="https://github.com/jonathand-cf" target="_blank" rel="noopener noreferrer" class="gh-dashboard__sublink">@jonathand-cf &rarr;</a>
    </div>
    <div class="gh-chart-wrapper">
      <img
        src="https://ghchart.rshah.org/0892d0/jonathand-cf"
        alt="Jonathan's GitHub contribution chart"
        class="gh-chart-img"
        loading="lazy"
      />
    </div>
  </div>
</section>

<script>
(function () {
  var userUrl = 'https://api.github.com/users/jonathand-cf';
  var reposUrl = 'https://api.github.com/users/jonathand-cf/repos?sort=pushed&direction=desc&per_page=30';

  function timeAgo(dateString) {
    var seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
    var days = Math.floor(seconds / 86400);
    if (days < 1) return 'Pushed today';
    if (days === 1) return 'Pushed yesterday';
    if (days < 30) return 'Pushed ' + days + 'd ago';
    var months = Math.floor(days / 30);
    return 'Pushed ' + months + 'mo ago';
  }

  fetch(userUrl)
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      if (data && typeof data.public_repos === 'number') {
        var el = document.getElementById('gh-repo-count');
        if (el) el.textContent = data.public_repos;
      }
    })
    .catch(function () {});

  fetch(reposUrl)
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (repos) {
      if (!Array.isArray(repos) || !repos.length) return;
      repos.sort(function (a, b) {
        return new Date(b.pushed_at) - new Date(a.pushed_at);
      });
      var latest = repos.find(function (r) {
        return r.name !== 'jonathand-cf.github.io' && r.name !== 'jonathand-cf';
      }) || repos[0];
      var latestRepoEl = document.getElementById('gh-latest-repo');
      var latestTimeEl = document.getElementById('gh-latest-time');
      var latestLinkEl = document.getElementById('gh-latest-link');
      if (latestRepoEl && latest.name) {
        latestRepoEl.textContent = latest.name;
      }
      if (latestTimeEl && latest.pushed_at) {
        latestTimeEl.textContent = timeAgo(latest.pushed_at);
      }
      if (latestLinkEl && latest.html_url) {
        latestLinkEl.href = latest.html_url;
      }
    })
    .catch(function () {});
})();
</script>
